name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: PHP syntax
        run: find . -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: WordPress Coding Standards
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction wp-coding-standards/wpcs:^3
          "$(composer global config bin-dir --absolute --quiet)/phpcs" --standard=phpcs.xml.dist

      - name: Package installable theme
        run: |
          mkdir -p dist/lean-block-theme
          cp -r style.css functions.php theme.json screenshot.png readme.txt LICENSE inc parts templates patterns assets build dist/lean-block-theme/
          cd dist && zip -rq lean-block-theme.zip lean-block-theme

      - uses: actions/upload-artifact@v4
        with:
          name: lean-block-theme
          path: dist/lean-block-theme.zip
